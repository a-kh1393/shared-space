plugins {
    id 'com.android.application'
}

android {
    namespace 'app.fazamoshtarak'
    compileSdk 34

    defaultConfig {
        applicationId "app.fazamoshtarak"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
